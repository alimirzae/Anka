name: Anka - Test, Build and IIS Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.csproj'
      - '**/*.sln'
      - '**/*.slnx'
      - '**/*.cs'
      - '**/*.razor'
      - 'wwwroot/**'
      - 'Components/**'
      - '**/*.json'
      - '.github/workflows/anka-deploy.yml'

permissions:
  contents: read

concurrency:
  group: anka-production
  cancel-in-progress: true

jobs:
  test-build-deploy:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
    env:
      IIS_SITE: anka.iyashil.com
      IIS_PATH: C:\inetpub\anka.iyashil.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate server and find web project
        id: discover
        run: |
          $ErrorActionPreference = 'Stop'
          $dotnetDir = 'C:\Program Files\dotnet'
          if (-not (Test-Path (Join-Path $dotnetDir 'dotnet.exe'))) { throw 'Install the .NET SDK on the runner.' }
          $env:PATH = "$dotnetDir;$env:PATH"
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $dotnetDir -Encoding utf8
          # The runner uses NETWORK SERVICE and must not read machine-wide IIS configuration.
          # The IIS site binding and physical path are provisioned separately by an administrator.
          $expected = 'C:\inetpub\anka.iyashil.com'
          if ($env:IIS_PATH -ine $expected -or -not (Test-Path -LiteralPath $expected -PathType Container)) {
            throw 'Anka IIS deployment directory is missing or does not match the allowlisted path.'
          }
          $projects = @(Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter *.csproj -Recurse -File |
            Where-Object { $_.FullName -notmatch '[\\/](bin|obj|node_modules)[\\/]' })
          $web = @($projects | Where-Object { (Get-Content $_.FullName -Raw) -match 'Microsoft.NET.Sdk.Web' })
          if ($web.Count -ne 1) { throw "Expected exactly one ASP.NET Core web project; found $($web.Count). Add the app source or select the web project explicitly." }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "project=$($web[0].FullName)" -Encoding utf8
          dotnet --info

      - name: Restore
        run: |
          dotnet restore "${{ steps.discover.outputs.project }}"
          if ($LASTEXITCODE -ne 0) { throw "dotnet restore failed with exit code $LASTEXITCODE" }

      - name: Build
        run: |
          dotnet build "${{ steps.discover.outputs.project }}" --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "dotnet build failed with exit code $LASTEXITCODE" }

      - name: Test
        run: |
          $tests = @(Get-ChildItem $env:GITHUB_WORKSPACE -Filter '*Tests.csproj' -Recurse -File | Where-Object { $_.FullName -notmatch '[\\/](bin|obj)[\\/]' })
          foreach ($testProject in $tests) {
            dotnet test $testProject.FullName --configuration Release --verbosity normal
            if ($LASTEXITCODE -ne 0) { throw "Tests failed: $($testProject.FullName)" }
          }
          if ($tests.Count -eq 0) { Write-Host 'No *Tests.csproj found. Build passed, but there are no automated tests yet.' }

      - name: Publish into staging directory
        run: |
          $staging = Join-Path $env:RUNNER_TEMP 'anka-publish'
          if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
          dotnet publish "${{ steps.discover.outputs.project }}" --configuration Release --no-build --output $staging
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed' }
          if (-not (Test-Path (Join-Path $staging 'web.config'))) {
            throw 'No web.config in publish output; verify that this is an ASP.NET Core IIS project.'
          }
          # Fail closed if a future project-file change accidentally bundles live data.
          # Never allow staged database files, EPUB assets, or DataProtection keys to
          # overwrite production content or leak through deployment artifacts.
          foreach ($protectedDirectory in @('App_Data', 'data', 'uploads')) {
            if (Test-Path -LiteralPath (Join-Path $staging $protectedDirectory)) {
              throw "Publish artifact unexpectedly contains protected directory: $protectedDirectory"
            }
          }
          $sensitiveFiles = @(Get-ChildItem -LiteralPath $staging -Recurse -File |
            Where-Object { $_.Extension -in @('.db', '.sqlite', '.sqlite3', '.epub', '.pfx') -or $_.Name -match '\.db-(wal|shm)
      - name: Prepare persistent SQLite storage
        run: |
          $ErrorActionPreference = 'Stop'
          $data = Join-Path $env:IIS_PATH 'App_Data'
          $epubs = Join-Path $data 'epubs'
          New-Item -ItemType Directory -Force -Path $epubs | Out-Null
          Write-Host "Persistent SQLite storage: $data"

      - name: Deploy to isolated IIS directory
        run: |
          $ErrorActionPreference = 'Stop'
          $staging = Join-Path $env:RUNNER_TEMP 'anka-publish'
          $dest = $env:IIS_PATH
          if (-not (Test-Path $dest -PathType Container)) { throw "IIS destination is missing: $dest" }
          $persistentBefore = @()
          $persistentRoot = Join-Path $dest 'App_Data'
          if (Test-Path -LiteralPath $persistentRoot -PathType Container) {
            $persistentBefore = @(Get-ChildItem -LiteralPath $persistentRoot -Recurse -File |
              Where-Object { $_.Extension -in @('.db', '.sqlite', '.sqlite3', '.epub') } |
              Select-Object -ExpandProperty FullName)
          }
          # Record hashes of immutable EPUB assets. SQLite files are intentionally not
          # hashed: legitimate concurrent database writes can change their contents.
          $epubHashesBefore = @{}
          foreach ($item in $persistentBefore) {
            if ([IO.Path]::GetExtension($item) -ieq '.epub') {
              $epubHashesBefore[$item] = (Get-FileHash -LiteralPath $item -Algorithm SHA256).Hash
            }
          }
          $appOffline = Join-Path $dest 'app_offline.htm'
          try {
            Set-Content -LiteralPath $appOffline -Value 'Anka is being updated. Please retry shortly.' -Encoding UTF8
            # /E overwrites app binaries, but does not delete existing data or uploads.
            & robocopy $staging $dest /E /R:2 /W:2 /XD App_Data data uploads logs /XF appsettings.Production.json *.db *.db-shm *.db-wal *.sqlite *.sqlite3 app_offline.htm
            $copyCode = $LASTEXITCODE
            if ($copyCode -ge 8) { throw "Robocopy failed with exit code $copyCode" }
            $global:LASTEXITCODE = 0
          } finally {
            Remove-Item -LiteralPath $appOffline -Force -ErrorAction SilentlyContinue
          }
          # Verify that every pre-existing persistent database and EPUB survived deployment.
          # This is a non-destructive guard; never recreate or replace missing assets.
          foreach ($item in $persistentBefore) {
            if (-not (Test-Path -LiteralPath $item -PathType Leaf)) {
              throw "Persistent ANKA asset disappeared during deployment: $item"
            }
          }
          # Existence alone does not detect a corrupted or overwritten EPUB.
          foreach ($item in $epubHashesBefore.Keys) {
            $currentHash = (Get-FileHash -LiteralPath $item -Algorithm SHA256).Hash
            if ($currentHash -ne $epubHashesBefore[$item]) {
              throw "Persistent ANKA EPUB changed during deployment: $item"
            }
          }
          Write-Host "Verified $($epubHashesBefore.Count) persistent EPUB SHA256 hashes."
          Write-Host "Anka published to $dest; persistent App_Data was preserved."
          try {
            $health = Invoke-WebRequest -Uri 'http://localhost/api/health' -Headers @{ Host = $env:IIS_SITE } -UseBasicParsing -TimeoutSec 20
            if ($health.StatusCode -ne 200) { throw "HTTP $($health.StatusCode)" }
            # Security regression smoke tests against the deployed Production site.
            # These requests are read-only; do not create users, books or entitlements.
            $hostHeaders = @{ Host = $env:IIS_SITE }
            foreach ($probe in @(
              @{ Path = '/api/account/test-login'; Expected = 404 },
              @{ Path = '/api/admin/publishers'; Expected = 401 },
              @{ Path = '/api/admin/submissions'; Expected = 401 },
              @{ Path = '/api/me/shelf'; Expected = 401 },
              @{ Path = '/api/publisher/my-submissions'; Expected = 401 },
              # A non-existent GUID must not bypass the entitlement gate.
              @{ Path = '/api/books/00000000-0000-0000-0000-000000000000/file'; Expected = 403 },
              @{ Path = '/api/books/00000000-0000-0000-0000-000000000000/reading-status'; Expected = 403 }
            )) {
              $code = 0
              try {
                $response = Invoke-WebRequest -Uri ("http://localhost" + $probe.Path) -Headers $hostHeaders -UseBasicParsing -TimeoutSec 15
                $code = [int]$response.StatusCode
              } catch {
                if ($_.Exception.Response) { $code = [int]$_.Exception.Response.StatusCode }
                else { throw "Security probe transport error on $($probe.Path): $($_.Exception.Message)" }
              }
              if ($code -ne $probe.Expected) {
                throw "Security regression on $($probe.Path): expected HTTP $($probe.Expected), received $code"
              }
              Write-Host "Security probe passed: $($probe.Path) -> HTTP $code"
            }
            # A same-origin anonymous upload must be rejected before any form parsing,
            # file write, or publisher submission is attempted.
            $uploadStatus = 0
            try {
              $uploadResponse = Invoke-WebRequest -Uri 'http://localhost/api/books' -Method Post -Headers @{ Host = $env:IIS_SITE; 'Sec-Fetch-Site' = 'same-origin' } -ContentType 'application/json' -Body '{}' -UseBasicParsing -TimeoutSec 15
              $uploadStatus = [int]$uploadResponse.StatusCode
            } catch {
              if ($_.Exception.Response) { $uploadStatus = [int]$_.Exception.Response.StatusCode }
              else { throw "Anonymous upload probe transport error: $($_.Exception.Message)" }
            }
            if ($uploadStatus -ne 403) {
              throw "Anonymous same-origin book upload must be forbidden: expected HTTP 403, received $uploadStatus"
            }
            Write-Host 'Anonymous same-origin publisher upload rejected (HTTP 403).'
            # The test-login endpoint is POST-only in Development. A GET 404 alone
            # cannot prove that its POST handler is absent from Production.
            # Use an invalid fixture account; this probe must never create or log in a user.
            $testLoginUrl = 'http://localhost/api/account/test-login'
            $testLoginStatus = 0
            try {
              $testLoginResponse = Invoke-WebRequest -Uri $testLoginUrl -Method Post -Headers $hostHeaders -ContentType 'application/json' -Body '{"email":"nonexistent-anka-security-probe@example.invalid","pin":"1234"}' -UseBasicParsing -TimeoutSec 15
              $testLoginStatus = [int]$testLoginResponse.StatusCode
            } catch {
              if ($_.Exception.Response) { $testLoginStatus = [int]$_.Exception.Response.StatusCode }
              else { throw "Test-login POST probe transport error: $($_.Exception.Message)" }
            }
            if ($testLoginStatus -ne 404) {
              throw "Production test-login POST must not exist: expected HTTP 404, received $testLoginStatus"
            }
            Write-Host 'Production test-login POST route is absent (HTTP 404).'
            # Verify that even a denied EPUB response cannot be stored by shared caches.
            $epubProbe = '/api/books/00000000-0000-0000-0000-000000000000/file'
            try {
              $denied = Invoke-WebRequest -Uri ("http://localhost" + $epubProbe) -Headers $hostHeaders -UseBasicParsing -TimeoutSec 15
              throw "Expected an entitlement denial, received HTTP $($denied.StatusCode)"
            } catch {
              if (-not $_.Exception.Response) { throw "EPUB cache probe transport error: $($_.Exception.Message)" }
              $deniedResponse = $_.Exception.Response
              if ([int]$deniedResponse.StatusCode -ne 403) { throw "EPUB cache probe expected HTTP 403" }
              $cacheControl = [string]$deniedResponse.Headers['Cache-Control']
              if ($cacheControl -notmatch 'no-store' -or $cacheControl -notmatch 'private') {
                throw "Protected EPUB response missing private, no-store: $cacheControl"
              }
              Write-Host 'Protected EPUB denial has private, no-store cache policy.'
            }
            # Reader diagnostics also contain private entitlement and reading metadata.
            # Verify denial responses cannot be cached, independently of EPUB downloads.
            $readerProbe = '/api/books/00000000-0000-0000-0000-000000000000/reading-status'
            try {
              $readerResponse = Invoke-WebRequest -Uri ("http://localhost" + $readerProbe) -Headers $hostHeaders -UseBasicParsing -TimeoutSec 15
              throw "Expected reader entitlement denial, received HTTP $($readerResponse.StatusCode)"
            } catch {
              if (-not $_.Exception.Response) { throw "Reader cache probe transport error: $($_.Exception.Message)" }
              $readerDenied = $_.Exception.Response
              if ([int]$readerDenied.StatusCode -ne 403) { throw 'Reader cache probe expected HTTP 403' }
              $readerCache = [string]$readerDenied.Headers['Cache-Control']
              if ($readerCache -notmatch 'no-store' -or $readerCache -notmatch 'private') {
                throw "Reader diagnostics denial missing private, no-store: $readerCache"
              }
              Write-Host 'Protected reader diagnostics denial has private, no-store cache policy.'
            }
            Start-Sleep -Seconds 22
            try {
              $catalog = Invoke-RestMethod -Uri 'http://localhost/api/catalog/status' -Headers @{ Host = $env:IIS_SITE } -TimeoutSec 15
              Write-Host "ANKA curated books imported: $($catalog.ready) / $($catalog.total)"
              foreach ($entry in $catalog.books) {
                Write-Host "$($entry.title): imported=$($entry.imported)"
              }
              if ($catalog.ready -lt $catalog.total) { Write-Warning "Some Wikisource imports are still pending or failed. The preview cards remain available." }
              # The reader diagnostics endpoint now enforces book entitlements.
              # An anonymous deployment probe cannot validate full text without an
              # authenticated test account with explicit access to this book.
              # Keep the entitlement smoke tests above; run full-reader QA separately
              # with an authorized fixture, never by weakening Production permissions.
              Write-Host 'Full EPUB page/character validation deferred to authorized reader integration tests.'
            } catch {
              throw "Catalog/EPUB reading validation failed: $($_.Exception.Message)"
            }

          } catch {
            throw "Deployment files copied, but Anka HTTP health check failed: $($_.Exception.Message). Run the IIS permissions script and inspect ASP.NET Core Module event logs."
          }
 })
          if ($sensitiveFiles.Count -gt 0) {
            throw "Publish artifact contains persistent or secret-bearing files: $($sensitiveFiles.Count)"
          }

      - name: Prepare persistent SQLite storage
        run: |
          $ErrorActionPreference = 'Stop'
          $data = Join-Path $env:IIS_PATH 'App_Data'
          $epubs = Join-Path $data 'epubs'
          New-Item -ItemType Directory -Force -Path $epubs | Out-Null
          Write-Host "Persistent SQLite storage: $data"

