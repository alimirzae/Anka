name: Anka - Test, Build and IIS Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.csproj'
      - '**/*.sln'
      - '**/*.slnx'
      - '**/*.cs'
      - '**/*.razor'
      - 'wwwroot/**'
      - 'Components/**'
      - '**/*.json'
      - '.github/workflows/anka-deploy.yml'

permissions:
  contents: read

concurrency:
  group: anka-production
  cancel-in-progress: true

jobs:
  test-build-deploy:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
    env:
      IIS_SITE: anka.iyashil.com
      IIS_PATH: C:\inetpub\anka.iyashil.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate server and find web project
        id: discover
        run: |
          $ErrorActionPreference = 'Stop'
          $dotnetDir = 'C:\Program Files\dotnet'
          if (-not (Test-Path (Join-Path $dotnetDir 'dotnet.exe'))) { throw 'Install the .NET SDK on the runner.' }
          $env:PATH = "$dotnetDir;$env:PATH"
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $dotnetDir -Encoding utf8
          # The runner uses NETWORK SERVICE and must not read machine-wide IIS configuration.
          # The IIS site binding and physical path are provisioned separately by an administrator.
          $expected = 'C:\inetpub\anka.iyashil.com'
          if ($env:IIS_PATH -ine $expected -or -not (Test-Path -LiteralPath $expected -PathType Container)) {
            throw 'Anka IIS deployment directory is missing or does not match the allowlisted path.'
          }
          $projects = @(Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter *.csproj -Recurse -File |
            Where-Object { $_.FullName -notmatch '[\\/](bin|obj|node_modules)[\\/]' })
          $web = @($projects | Where-Object { (Get-Content $_.FullName -Raw) -match 'Microsoft.NET.Sdk.Web' })
          if ($web.Count -ne 1) { throw "Expected exactly one ASP.NET Core web project; found $($web.Count). Add the app source or select the web project explicitly." }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "project=$($web[0].FullName)" -Encoding utf8
          dotnet --info

      - name: Restore
        run: dotnet restore "${{ steps.discover.outputs.project }}"

      - name: Build
        run: dotnet build "${{ steps.discover.outputs.project }}" --configuration Release --no-restore

      - name: Test
        run: |
          $tests = @(Get-ChildItem $env:GITHUB_WORKSPACE -Filter '*Tests.csproj' -Recurse -File | Where-Object { $_.FullName -notmatch '[\\/](bin|obj)[\\/]' })
          foreach ($testProject in $tests) {
            dotnet test $testProject.FullName --configuration Release --verbosity normal
            if ($LASTEXITCODE -ne 0) { throw "Tests failed: $($testProject.FullName)" }
          }
          if ($tests.Count -eq 0) { Write-Host 'No *Tests.csproj found. Build passed, but there are no automated tests yet.' }

      - name: Publish into staging directory
        run: |
          $staging = Join-Path $env:RUNNER_TEMP 'anka-publish'
          if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
          dotnet publish "${{ steps.discover.outputs.project }}" --configuration Release --no-build --output $staging
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed' }
          if (-not (Test-Path (Join-Path $staging 'web.config'))) {
            throw 'No web.config in publish output; verify that this is an ASP.NET Core IIS project.'
          }

      - name: Prepare persistent SQLite storage
        run: |
          $ErrorActionPreference = 'Stop'
          $data = Join-Path $env:IIS_PATH 'App_Data'
          $epubs = Join-Path $data 'epubs'
          New-Item -ItemType Directory -Force -Path $epubs | Out-Null
          Write-Host "Persistent SQLite storage: $data"

      - name: Deploy to isolated IIS directory
        run: |
          $ErrorActionPreference = 'Stop'
          $staging = Join-Path $env:RUNNER_TEMP 'anka-publish'
          $dest = $env:IIS_PATH
          if (-not (Test-Path $dest -PathType Container)) { throw "IIS destination is missing: $dest" }
          $appOffline = Join-Path $dest 'app_offline.htm'
          try {
            Set-Content -LiteralPath $appOffline -Value 'Anka is being updated. Please retry shortly.' -Encoding UTF8
            # /E overwrites app binaries, but does not delete existing data or uploads.
            & robocopy $staging $dest /E /R:2 /W:2 /XD App_Data data uploads logs /XF appsettings.Production.json *.db *.db-shm *.db-wal *.sqlite *.sqlite3 app_offline.htm
            $copyCode = $LASTEXITCODE
            if ($copyCode -ge 8) { throw "Robocopy failed with exit code $copyCode" }
            $global:LASTEXITCODE = 0
          } finally {
            Remove-Item -LiteralPath $appOffline -Force -ErrorAction SilentlyContinue
          }
          Write-Host "Anka published to $dest; persistent App_Data was preserved."
          try {
            $health = Invoke-WebRequest -Uri 'http://localhost/api/health' -Headers @{ Host = $env:IIS_SITE } -UseBasicParsing -TimeoutSec 20
            if ($health.StatusCode -ne 200) { throw "HTTP $($health.StatusCode)" }
            Start-Sleep -Seconds 22
            try {
              $catalog = Invoke-RestMethod -Uri 'http://localhost/api/catalog/status' -Headers @{ Host = $env:IIS_SITE } -TimeoutSec 15
              Write-Host "ANKA curated books imported: $($catalog.ready) / $($catalog.total)"
              foreach ($entry in $catalog.books) {
                Write-Host "$($entry.title): imported=$($entry.imported)"
              }
              if ($catalog.ready -lt $catalog.total) { Write-Warning "Some Wikisource imports are still pending or failed. The preview cards remain available." }
              $book = Invoke-RestMethod -Uri 'http://localhost/api/books/2871f572-093a-f46f-bc1f-b325cdcdbeae/reading-status' -Headers @{ Host = $env:IIS_SITE } -TimeoutSec 20
              Write-Host "Required Pembe Incili Kaftan full reader: pages=$($book.pages) characters=$($book.characters)"
              if ($book.pages -lt 2 -or $book.characters -lt 2000) {
                throw "Reader check failed: required book did not render as a full multi-page text."
              }
            } catch {
              Write-Warning "Could not inspect curated catalog status: $($_.Exception.Message)"
            }

          } catch {
            throw "Deployment files copied, but Anka HTTP health check failed: $($_.Exception.Message). Run the IIS permissions script and inspect ASP.NET Core Module event logs."
          }
