name: Anka - Build Verification

on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/reader-immersive-three-column']
    paths:
      - '**/*.cs'
      - '**/*.razor'
      - '**/*.csproj'
      - 'wwwroot/**'
      - '.github/workflows/build-verify.yml'
  pull_request:
    branches: [main, 'feature/reader-side-navigation-az-editions']

permissions:
  contents: read

concurrency:
  group: anka-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Anka.csproj
      - name: Compile Blazor Server
        run: dotnet build Anka.csproj -c Release --no-restore -warnaserror
      - name: Publish package verification
        run: dotnet publish Anka.csproj -c Release --no-build -o ./out
