name: Anka - Recover Stale Deploy Queue

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/anka-recover.yml'
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  unblock-stale:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel only stale Anka deploy runs from older commits
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const branch=await github.rest.repos.getBranch({owner,repo,branch:'main'});
            const latest=branch.data.commit.sha;
            const runs=await github.rest.actions.listWorkflowRuns({
              owner,repo,workflow_id:'anka-deploy.yml',status:'in_progress',per_page:40
            });
            for(const run of runs.data.workflow_runs){
              const age=Date.now()-new Date(run.created_at).getTime();
              if(run.head_sha===latest || age<120000)continue;
              core.info(`Cancel old Anka deploy #${run.id}, SHA ${run.head_sha}`);
              try{
                await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel',{
                  owner,repo,run_id:run.id
                });
              }catch(e){
                core.warning(`Force cancel failed: ${e.message}; trying regular cancel`);
                try{await github.rest.actions.cancelWorkflowRun({owner,repo,run_id:run.id});}
                catch(other){core.warning(`Cannot cancel #${run.id}: ${other.message}`);}
              }
            }
