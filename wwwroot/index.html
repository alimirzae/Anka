<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anka | کتابخانه هوشمند</title><link rel="stylesheet" href="/styles.css"></head>
<body>
<header><a class="brand" href="/">✦ ANKA <small id="brandCaption">کتابخانه</small></a>
<nav><button type="button" data-view="library" id="navLibrary">کتابخانه</button><button type="button" data-view="upload" id="navUpload">افزودن کتاب</button></nav>
<div class="headtools"><select id="lang" aria-label="Interface language"><option value="fa">فارسی</option><option value="az">Azərbaycan</option><option value="az-arab">آذربایجان تورکجه‌سی</option><option value="tr">Türkçe</option></select><button id="theme" title="Light or dark">◐</button></div></header>
<main>
<section id="libraryView"><div class="intro"><p class="eyebrow">ANKA DIGITAL READER</p><h1 id="heroTitle">کتابخانه من</h1><p id="heroText">کتاب‌های EPUB خود را بارگذاری کنید و از هر دستگاه بخوانید.</p></div>
<div class="toolbar"><input id="search" type="search" placeholder="جستجوی کتاب یا نویسنده"><span id="bookCount"></span></div><div id="books" class="books" aria-live="polite"></div></section>
<section id="uploadView" hidden><div class="intro"><p class="eyebrow">MY COLLECTION</p><h1 id="uploadTitle">افزودن کتاب EPUB</h1></div>
<form id="uploadForm" class="form"><label id="fileLabel" for="file">فایل EPUB</label><input id="file" name="file" type="file" accept=".epub,application/epub+zip" required>
<label id="titleLabel" for="title">عنوان (اختیاری)</label><input id="title" name="title" maxlength="500">
<label id="authorLabel" for="author">نویسنده (اختیاری)</label><input id="author" name="author" maxlength="300">
<label id="languageLabel" for="bookLang">زبان کتاب</label><select id="bookLang" name="language"><option value="az">Azərbaycan türkcəsi</option><option value="az-Arab">آذربایجان تورکجه‌سی</option><option value="tr">Türkçe</option><option value="fa">فارسی</option></select>
<button class="primary" id="submitUpload" type="submit">افزودن به کتابخانه</button><p class="notice" id="uploadNotice"></p></form></section>
<section id="readerView" hidden><div class="readerbar"><button id="back">← <span id="backText">کتابخانه</span></button><strong id="readingTitle"></strong><div class="readeractions"><button id="tocToggle" aria-label="Table of contents">☷</button><button id="fontMinus" aria-label="Smaller font">A−</button><button id="fontPlus" aria-label="Larger font">A+</button><button id="readerTheme" aria-label="Reading theme">◐</button><select id="readerFlow" aria-label="Reading layout"><option value="paginated">صفحه‌ای</option><option value="scrolled-doc">پیوسته</option></select></div></div>
<div class="readershell"><aside id="toc" hidden></aside><div class="reading"><div id="epub"></div><div class="pager"><button id="prev" aria-label="Previous page">❮</button><span id="location">—</span><button id="next" aria-label="Next page">❯</button></div></div></div><div id="selection" class="selection" hidden><button id="highlight">✎ <span id="highlightText">نشان‌گذاری</span></button><button id="copyQuote">⧉ <span id="copyText">کپی</span></button><button id="translate">🌐 <span id="translateText">ترجمه</span></button></div>
<div id="translationPanel" class="translation" hidden><div><strong id="translationTitle">ترجمه و واژه‌نامه</strong><button id="closeTranslation">×</button></div><blockquote id="selectedQuote"></blockquote><select id="translateLang"><option value="fa">فارسی</option><option value="az">Azərbaycan</option><option value="tr">Türkçe</option><option value="en">English</option></select><p id="translationHelp">متن برای جستجو در فرهنگ لغت آماده است.</p><a id="dictionaryLink" target="_blank" rel="noopener noreferrer">جستجوی واژه</a></div></section>
</main><footer>ANKA · EPUB Reader · Phase 1</footer>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script><script src="/app.js"></script>
</body></html>
